# staging: 2 shards x 2 replica(s) + 3 Keeper. Generated from the Terraform node map; keep in sync.
# Connection is via SSM Session Manager (no SSH): ansible_connection=community.aws.aws_ssm.
all:
  children:
    clickhouse:   # rolling changes go replica_r2 first (canary), then replica_r1
      children:
        replica_r1:
          hosts:
            ch-s01-r1: { shard: "01", replica: "ch-s01-r1" }
            ch-s02-r1: { shard: "02", replica: "ch-s02-r1" }
        replica_r2:
          hosts:
            ch-s01-r2: { shard: "01", replica: "ch-s01-r2" }
            ch-s02-r2: { shard: "02", replica: "ch-s02-r2" }
    keeper:
      hosts:
        keeper-1: { keeper_server_id: 1 }
        keeper-2: { keeper_server_id: 2 }
        keeper-3: { keeper_server_id: 3 }
