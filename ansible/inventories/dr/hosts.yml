# dr: 12 shards x 1 replica(s) + 3 Keeper. Generated from the Terraform node map; keep in sync.
# Connection is via SSM Session Manager (no SSH): ansible_connection=community.aws.aws_ssm.
all:
  children:
    clickhouse:   # rolling changes go replica_r2 first (canary), then replica_r1
      children:
        replica_r1:
          hosts:
            ch-s01-r1: { shard: "01", replica: "ch-s01-r1" }
            ch-s02-r1: { shard: "02", replica: "ch-s02-r1" }
            ch-s03-r1: { shard: "03", replica: "ch-s03-r1" }
            ch-s04-r1: { shard: "04", replica: "ch-s04-r1" }
            ch-s05-r1: { shard: "05", replica: "ch-s05-r1" }
            ch-s06-r1: { shard: "06", replica: "ch-s06-r1" }
            ch-s07-r1: { shard: "07", replica: "ch-s07-r1" }
            ch-s08-r1: { shard: "08", replica: "ch-s08-r1" }
            ch-s09-r1: { shard: "09", replica: "ch-s09-r1" }
            ch-s10-r1: { shard: "10", replica: "ch-s10-r1" }
            ch-s11-r1: { shard: "11", replica: "ch-s11-r1" }
            ch-s12-r1: { shard: "12", replica: "ch-s12-r1" }
    keeper:
      hosts:
        keeper-1: { keeper_server_id: 1 }
        keeper-2: { keeper_server_id: 2 }
        keeper-3: { keeper_server_id: 3 }
