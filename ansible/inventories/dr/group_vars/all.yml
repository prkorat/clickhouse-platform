# Values shared by every host in dr. Secrets are NOT here: Vault Agent renders them at boot.
ch_cluster: dr
ch_env: dr
ch_dns_zone: ch.dr.internal
aws_region: us-west-2
ch_version: "25.8.10.7"          # pin exact LTS patch; bump via PR + rolling_upgrade.yml
ch_shard_count: 12
ch_replicas_per_shard: 1
ch_cold_bucket: ch-dr-usw2-cold
ch_s3_cold_kms_key_arn: "arn:aws:kms:us-west-2:111122223333:key/REPLACE-s3-cold"
vault_addr: https://vault.corp.example.com:8200
vault_pki_role: pki_int_clickhouse/issue/ch-server
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: us-west-2
ansible_aws_ssm_bucket_name: ssm-ansible-transfer-dr
