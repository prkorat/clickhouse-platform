---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload udev
  ansible.builtin.shell: udevadm control --reload && udevadm trigger
  changed_when: true

- name: Reload nftables
  ansible.builtin.command: nft -f /etc/nftables.d/clickhouse.nft
  changed_when: true
