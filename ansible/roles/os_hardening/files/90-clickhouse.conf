# Managed by Ansible (roles/os_hardening). Design doc Section 5.1. Do not edit on hosts.
# --- Memory ---
# many parts x many columns are mmapped; 65530 default causes mmap failures
vm.max_map_count = 1048576
# swap is also disabled; this is the fallback if swap is re-added
vm.swappiness = 1
# ClickHouse expects heuristic overcommit; 2 causes spurious allocation failures
vm.overcommit_memory = 0
vm.dirty_background_ratio = 5
# flush steadily; avoid multi-second write stalls during merges
vm.dirty_ratio = 10
# never reclaim locally on NUMA; use remote memory instead
vm.zone_reclaim_mode = 0
# enables ClickHouse OSIOWait/OSCPUWait per-query metrics
kernel.task_delayacct = 1

# --- Files ---
fs.file-max = 4194304
fs.aio-max-nr = 1048576
fs.suid_dumpable = 0

# --- Network throughput (37.5 Gbps NICs, replica fetches, distributed queries) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
# detect dead peers well inside the 30 s Keeper session timeout window
net.ipv4.tcp_keepalive_time = 60
net.ipv4.tcp_keepalive_intvl = 10
net.ipv4.tcp_keepalive_probes = 6

# --- Network security ---
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv6.conf.all.accept_redirects = 0

# --- Kernel security ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.randomize_va_space = 2
kernel.yama.ptrace_scope = 1
kernel.perf_event_paranoid = 2
