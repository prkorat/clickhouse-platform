# Alertmanager routing (design doc Section 6.1). Secrets (PagerDuty key, Slack webhook) are injected
# from Secrets Manager by the ArgoCD-managed deployment, never committed.
route:
  receiver: team-channel
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: pagerduty
    - matchers: [team="security"]
      receiver: security-oncall

inhibit_rules:
  # A node that is down will also report replication lag and read-only replicas; page once.
  - source_matchers: [alertname="ClickHouseNodeDown"]
    target_matchers: [alertname=~"ClickHouseReplicationLag.*|ClickHouseReadonlyReplica"]
    equal: [instance]
  # Keeper quorum loss explains every read-only replica.
  - source_matchers: [alertname="KeeperQuorumDegraded"]
    target_matchers: [alertname="ClickHouseReadonlyReplica"]

receivers:
  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/pagerduty_routing_key
  - name: security-oncall
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/secrets/security_routing_key
  - name: team-channel
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook
        channel: "#data-platform-alerts"
        send_resolved: true
