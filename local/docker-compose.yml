# Local development cluster: 2 shards x 2 replicas + 3 ClickHouse Keeper nodes.
# Same topology shape, macros, storage policy names, access model and migrations as production,
# but plaintext ports on localhost and no LDAP. Never expose these ports beyond 127.0.0.1.
#
#   make up        start
#   make db-init   apply access model + migrations
#   make client    clickhouse-client as admin on ch-s1-r1
#   make down      stop and delete volumes

x-clickhouse: &clickhouse
  image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.8}
  ulimits:
    nofile: { soft: 262144, hard: 262144 }
  depends_on: [keeper-1, keeper-2, keeper-3]
  environment:
    CLICKHOUSE_SKIP_USER_SETUP: "1"
    CH_CLUSTER_SECRET: local-cluster-secret
    CH_DISK_KEY_1: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
    CH_DISK_KEY_2: "ffeeddccbbaa99887766554433221100ffeeddccbbaa99887766554433221100"
    CH_REGULATED_KEY_1: "0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0"
  healthcheck:
    test: ["CMD", "clickhouse-client", "--user", "admin", "--password", "admin", "--query", "SELECT 1"]
    interval: 5s
    timeout: 3s
    retries: 30

x-keeper: &keeper
  image: clickhouse/clickhouse-keeper:${CLICKHOUSE_VERSION:-25.8}

services:
  keeper-1:
    <<: *keeper
    hostname: keeper-1
    volumes: ["./keeper/keeper-1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro"]
  keeper-2:
    <<: *keeper
    hostname: keeper-2
    volumes: ["./keeper/keeper-2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro"]
  keeper-3:
    <<: *keeper
    hostname: keeper-3
    volumes: ["./keeper/keeper-3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro"]

  ch-s1-r1:
    <<: *clickhouse
    hostname: ch-s1-r1
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    volumes:
      - ./clickhouse/config.d/00-local-cluster.xml:/etc/clickhouse-server/config.d/00-local-cluster.xml:ro
      - ./clickhouse/config.d/20-access-local.xml:/etc/clickhouse-server/config.d/20-access-local.xml:ro
      - ./clickhouse/config.d/30-storage-local.xml:/etc/clickhouse-server/config.d/30-storage-local.xml:ro
      - ../clickhouse/config.d/40-logs.xml:/etc/clickhouse-server/config.d/40-logs.xml:ro
      - ../clickhouse/config.d/50-limits.xml:/etc/clickhouse-server/config.d/50-limits.xml:ro
      - ../clickhouse/config.d/60-query-masking.xml:/etc/clickhouse-server/config.d/60-query-masking.xml:ro
      - ../clickhouse/users.d/log-settings.xml:/etc/clickhouse-server/users.d/log-settings.xml:ro
      - ./clickhouse/users.d/local-users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
      - ./clickhouse/macros/ch-s1-r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
  ch-s1-r2:
    <<: *clickhouse
    hostname: ch-s1-r2
    ports: ["127.0.0.1:8124:8123", "127.0.0.1:9001:9000"]
    volumes:
      - ./clickhouse/config.d/00-local-cluster.xml:/etc/clickhouse-server/config.d/00-local-cluster.xml:ro
      - ./clickhouse/config.d/20-access-local.xml:/etc/clickhouse-server/config.d/20-access-local.xml:ro
      - ./clickhouse/config.d/30-storage-local.xml:/etc/clickhouse-server/config.d/30-storage-local.xml:ro
      - ../clickhouse/config.d/40-logs.xml:/etc/clickhouse-server/config.d/40-logs.xml:ro
      - ../clickhouse/config.d/50-limits.xml:/etc/clickhouse-server/config.d/50-limits.xml:ro
      - ../clickhouse/config.d/60-query-masking.xml:/etc/clickhouse-server/config.d/60-query-masking.xml:ro
      - ../clickhouse/users.d/log-settings.xml:/etc/clickhouse-server/users.d/log-settings.xml:ro
      - ./clickhouse/users.d/local-users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
      - ./clickhouse/macros/ch-s1-r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
  ch-s2-r1:
    <<: *clickhouse
    hostname: ch-s2-r1
    ports: ["127.0.0.1:8125:8123", "127.0.0.1:9002:9000"]
    volumes:
      - ./clickhouse/config.d/00-local-cluster.xml:/etc/clickhouse-server/config.d/00-local-cluster.xml:ro
      - ./clickhouse/config.d/20-access-local.xml:/etc/clickhouse-server/config.d/20-access-local.xml:ro
      - ./clickhouse/config.d/30-storage-local.xml:/etc/clickhouse-server/config.d/30-storage-local.xml:ro
      - ../clickhouse/config.d/40-logs.xml:/etc/clickhouse-server/config.d/40-logs.xml:ro
      - ../clickhouse/config.d/50-limits.xml:/etc/clickhouse-server/config.d/50-limits.xml:ro
      - ../clickhouse/config.d/60-query-masking.xml:/etc/clickhouse-server/config.d/60-query-masking.xml:ro
      - ../clickhouse/users.d/log-settings.xml:/etc/clickhouse-server/users.d/log-settings.xml:ro
      - ./clickhouse/users.d/local-users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
      - ./clickhouse/macros/ch-s2-r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
  ch-s2-r2:
    <<: *clickhouse
    hostname: ch-s2-r2
    ports: ["127.0.0.1:8126:8123", "127.0.0.1:9003:9000"]
    volumes:
      - ./clickhouse/config.d/00-local-cluster.xml:/etc/clickhouse-server/config.d/00-local-cluster.xml:ro
      - ./clickhouse/config.d/20-access-local.xml:/etc/clickhouse-server/config.d/20-access-local.xml:ro
      - ./clickhouse/config.d/30-storage-local.xml:/etc/clickhouse-server/config.d/30-storage-local.xml:ro
      - ../clickhouse/config.d/40-logs.xml:/etc/clickhouse-server/config.d/40-logs.xml:ro
      - ../clickhouse/config.d/50-limits.xml:/etc/clickhouse-server/config.d/50-limits.xml:ro
      - ../clickhouse/config.d/60-query-masking.xml:/etc/clickhouse-server/config.d/60-query-masking.xml:ro
      - ../clickhouse/users.d/log-settings.xml:/etc/clickhouse-server/users.d/log-settings.xml:ro
      - ./clickhouse/users.d/local-users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
      - ./clickhouse/macros/ch-s2-r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
